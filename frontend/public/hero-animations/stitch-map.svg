<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Stitch doing hand mapping/gestures -->
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="45" ry="48" fill="#6B9BFA"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="40" ry="35" fill="#6B9BFA"/>
  
  <!-- Ears -->
  <ellipse cx="55" cy="45" rx="15" ry="28" fill="#6B9BFA" transform="rotate(-25 55 45)"/>
  <ellipse cx="145" cy="45" rx="15" ry="28" fill="#6B9BFA" transform="rotate(25 145 45)"/>
  <ellipse cx="55" cy="45" rx="9" ry="20" fill="#FFB6C1" transform="rotate(-25 55 45)"/>
  <ellipse cx="145" cy="45" rx="9" ry="20" fill="#FFB6C1" transform="rotate(25 145 45)"/>
  
  <!-- Eyes (happy) -->
  <path d="M 72 73 Q 82 65 92 73" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 108 73 Q 118 65 128 73" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="6" ry="5" fill="#FF69B4"/>
  
  <!-- Big smile -->
  <path d="M 80 95 Q 100 115 120 95" stroke="#1a1a2e" stroke-width="3" fill="none"/>
  
  <!-- Arms in sign language pose -->
  <g class="left-arm">
    <ellipse cx="45" cy="110" rx="12" ry="22" fill="#6B9BFA" transform="rotate(45 45 110)"/>
    <circle cx="28" cy="92" r="10" fill="#6B9BFA"/>
    <!-- Fingers spread -->
    <ellipse cx="20" cy="82" rx="4" ry="8" fill="#6B9BFA" transform="rotate(-20 20 82)"/>
    <ellipse cx="28" cy="78" rx="4" ry="9" fill="#6B9BFA"/>
    <ellipse cx="36" cy="82" rx="4" ry="8" fill="#6B9BFA" transform="rotate(20 36 82)"/>
  </g>
  
  <g class="right-arm">
    <ellipse cx="155" cy="110" rx="12" ry="22" fill="#6B9BFA" transform="rotate(-45 155 110)"/>
    <circle cx="172" cy="92" r="10" fill="#6B9BFA"/>
    <!-- Pointing finger -->
    <ellipse cx="180" cy="80" rx="4" ry="10" fill="#6B9BFA" transform="rotate(15 180 80)"/>
  </g>
  
  <!-- Mapping lines/connections -->
  <g class="connections" opacity="0.6">
    <line x1="28" y1="92" x2="60" y2="75" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="172" y1="92" x2="140" y2="75" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="60" cy="75" r="4" fill="#4ECDC4"/>
    <circle cx="140" cy="75" r="4" fill="#FF6B6B"/>
  </g>
  
  <!-- Feet -->
  <ellipse cx="75" cy="185" rx="15" ry="10" fill="#6B9BFA"/>
  <ellipse cx="125" cy="185" rx="15" ry="10" fill="#6B9BFA"/>
  
  <!-- Sparkles -->
  <circle cx="15" cy="75" r="4" fill="#FFD93D" class="sparkle"/>
  <circle cx="185" cy="70" r="3" fill="#FF6B6B" class="sparkle" style="animation-delay: 0.4s"/>
  <circle cx="100" cy="35" r="3" fill="#4ECDC4" class="sparkle" style="animation-delay: 0.8s"/>
  
  <style>
    .left-arm {
      animation: signLeft 1.5s ease-in-out infinite;
      transform-origin: 45px 110px;
    }
    .right-arm {
      animation: signRight 1.5s ease-in-out infinite;
      transform-origin: 155px 110px;
    }
    .connections {
      animation: pulse 2s ease-in-out infinite;
    }
    .sparkle {
      animation: twinkle 1.2s ease-in-out infinite;
    }
    @keyframes signLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }
    @keyframes signRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.5); }
    }
  </style>
</svg>