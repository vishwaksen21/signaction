<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g transform="translate(50,50)">
    <!-- Palm -->
    <ellipse cx="0" cy="10" rx="18" ry="22" fill="url(#handGrad)"/>
    <!-- Fingers -->
    <g class="fingers">
      <rect x="-12" y="-25" width="7" height="20" rx="3.5" fill="url(#handGrad)"/>
      <rect x="-3" y="-30" width="7" height="25" rx="3.5" fill="url(#handGrad)"/>
      <rect x="6" y="-28" width="7" height="23" rx="3.5" fill="url(#handGrad)"/>
      <rect x="14" y="-22" width="6" height="18" rx="3" fill="url(#handGrad)"/>
    </g>
    <!-- Thumb -->
    <rect x="-22" y="0" width="12" height="7" rx="3.5" fill="url(#handGrad)" transform="rotate(-20 -16 3)"/>
  </g>
  <style>
    .fingers {
      animation: wave 0.8s ease-in-out infinite;
      transform-origin: 0px 10px;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }
  </style>
</svg>