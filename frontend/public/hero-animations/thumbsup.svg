<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BCB77;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g class="thumb-group" transform="translate(50,55)">
    <!-- Fist -->
    <ellipse cx="0" cy="8" rx="16" ry="14" fill="url(#thumbGrad)"/>
    <!-- Thumb up -->
    <rect x="-6" y="-22" width="10" height="24" rx="5" fill="url(#thumbGrad)"/>
    <!-- Sparkles -->
    <circle cx="-18" cy="-18" r="3" fill="#FFD93D" class="sparkle s1"/>
    <circle cx="18" cy="-12" r="2" fill="#FFD93D" class="sparkle s2"/>
    <circle cx="0" cy="-28" r="2.5" fill="#FFD93D" class="sparkle s3"/>
  </g>
  <style>
    .thumb-group {
      animation: bounce 1s ease-in-out infinite;
    }
    .sparkle {
      animation: twinkle 1.2s ease-in-out infinite;
    }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.4s; }
    .s3 { animation-delay: 0.8s; }
    @keyframes bounce {
      0%, 100% { transform: translate(50px, 55px) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.05); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }
  </style>
</svg>