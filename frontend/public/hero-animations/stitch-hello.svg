<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7CF7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="60" cy="95" rx="32" ry="38" fill="url(#bodyGrad)"/>
  
  <!-- Head -->
  <ellipse cx="60" cy="50" rx="28" ry="25" fill="url(#bodyGrad)"/>
  
  <!-- Ears -->
  <ellipse cx="35" cy="30" rx="12" ry="20" fill="url(#bodyGrad)" transform="rotate(-20 35 30)"/>
  <ellipse cx="85" cy="30" rx="12" ry="20" fill="url(#bodyGrad)" transform="rotate(20 85 30)"/>
  <ellipse cx="35" cy="30" rx="7" ry="14" fill="#FFB6C1" transform="rotate(-20 35 30)"/>
  <ellipse cx="85" cy="30" rx="7" ry="14" fill="#FFB6C1" transform="rotate(20 85 30)"/>
  
  <!-- Eyes -->
  <ellipse cx="48" cy="48" rx="8" ry="9" fill="white"/>
  <ellipse cx="72" cy="48" rx="8" ry="9" fill="white"/>
  <circle cx="50" cy="49" r="5" fill="#1a1a2e"/>
  <circle cx="74" cy="49" r="5" fill="#1a1a2e"/>
  <circle cx="52" cy="47" r="2" fill="white"/>
  <circle cx="76" cy="47" r="2" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="56" rx="5" ry="4" fill="#FF69B4"/>
  
  <!-- Mouth -->
  <path d="M 50 62 Q 60 70 70 62" stroke="#1a1a2e" stroke-width="2" fill="none"/>
  
  <!-- Waving arm -->
  <g class="wave-arm">
    <ellipse cx="95" cy="75" rx="10" ry="18" fill="url(#bodyGrad)" transform="rotate(-30 95 75)"/>
    <!-- Hand -->
    <circle cx="108" cy="58" r="10" fill="url(#bodyGrad)"/>
    <!-- Fingers -->
    <ellipse cx="108" cy="48" rx="3" ry="6" fill="url(#bodyGrad)"/>
    <ellipse cx="103" cy="50" rx="3" ry="5" fill="url(#bodyGrad)" transform="rotate(-15 103 50)"/>
    <ellipse cx="113" cy="50" rx="3" ry="5" fill="url(#bodyGrad)" transform="rotate(15 113 50)"/>
  </g>
  
  <!-- Other arm -->
  <ellipse cx="28" cy="90" rx="10" ry="15" fill="url(#bodyGrad)" transform="rotate(20 28 90)"/>
  <circle cx="18" cy="100" r="8" fill="url(#bodyGrad)"/>
  
  <!-- Feet -->
  <ellipse cx="45" cy="130" rx="12" ry="8" fill="url(#bodyGrad)"/>
  <ellipse cx="75" cy="130" rx="12" ry="8" fill="url(#bodyGrad)"/>
  
  <!-- Sparkles -->
  <circle cx="115" cy="45" r="3" fill="#FFD93D" class="sparkle"/>
  <circle cx="120" cy="55" r="2" fill="#FFD93D" class="sparkle" style="animation-delay: 0.3s"/>
  <circle cx="112" cy="38" r="2" fill="#FFD93D" class="sparkle" style="animation-delay: 0.6s"/>
  
  <style>
    .wave-arm {
      animation: wave 0.8s ease-in-out infinite;
      transform-origin: 95px 75px;
    }
    .sparkle {
      animation: twinkle 1s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.5); }
    }
  </style>
</svg>