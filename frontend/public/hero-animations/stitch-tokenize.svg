<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Stitch doing tokenization - organizing letter blocks -->
  
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="45" ry="50" fill="#6B9BFA"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="70" rx="40" ry="35" fill="#6B9BFA"/>
  
  <!-- Ears -->
  <ellipse cx="55" cy="40" rx="15" ry="28" fill="#6B9BFA" transform="rotate(-25 55 40)"/>
  <ellipse cx="145" cy="40" rx="15" ry="28" fill="#6B9BFA" transform="rotate(25 145 40)"/>
  <ellipse cx="55" cy="40" rx="9" ry="20" fill="#FFB6C1" transform="rotate(-25 55 40)"/>
  <ellipse cx="145" cy="40" rx="9" ry="20" fill="#FFB6C1" transform="rotate(25 145 40)"/>
  
  <!-- Eyes (focused) -->
  <ellipse cx="82" cy="68" rx="10" ry="11" fill="white"/>
  <ellipse cx="118" cy="68" rx="10" ry="11" fill="white"/>
  <circle cx="85" cy="70" r="6" fill="#1a1a2e"/>
  <circle cx="121" cy="70" r="6" fill="#1a1a2e"/>
  <circle cx="87" cy="68" r="2" fill="white"/>
  <circle cx="123" cy="68" r="2" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="80" rx="6" ry="5" fill="#FF69B4"/>
  
  <!-- Concentrating mouth -->
  <ellipse cx="100" cy="92" rx="8" ry="4" fill="#1a1a2e"/>
  
  <!-- Arms holding blocks -->
  <ellipse cx="50" cy="120" rx="12" ry="20" fill="#6B9BFA" transform="rotate(30 50 120)"/>
  <ellipse cx="150" cy="120" rx="12" ry="20" fill="#6B9BFA" transform="rotate(-30 150 120)"/>
  
  <!-- Hands -->
  <circle cx="38" cy="135" r="10" fill="#6B9BFA"/>
  <circle cx="162" cy="135" r="10" fill="#6B9BFA"/>
  
  <!-- Letter blocks being organized -->
  <g class="blocks">
    <rect x="25" y="140" width="22" height="22" rx="4" fill="#FFD93D" stroke="#E6B800" stroke-width="2"/>
    <text x="36" y="156" font-size="14" font-weight="bold" fill="#8B4513" text-anchor="middle">S</text>
    
    <rect x="55" y="138" width="22" height="22" rx="4" fill="#FF6B6B" stroke="#CC5555" stroke-width="2"/>
    <text x="66" y="154" font-size="14" font-weight="bold" fill="white" text-anchor="middle">T</text>
    
    <rect x="123" y="138" width="22" height="22" rx="4" fill="#4ECDC4" stroke="#3BA89F" stroke-width="2"/>
    <text x="134" y="154" font-size="14" font-weight="bold" fill="white" text-anchor="middle">A</text>
    
    <rect x="153" y="140" width="22" height="22" rx="4" fill="#9B59B6" stroke="#7D3C98" stroke-width="2"/>
    <text x="164" y="156" font-size="14" font-weight="bold" fill="white" text-anchor="middle">R</text>
  </g>
  
  <!-- Sparkles -->
  <circle cx="30" cy="130" r="3" fill="#FFD93D" class="sparkle"/>
  <circle cx="170" cy="125" r="2" fill="#FF6B6B" class="sparkle" style="animation-delay: 0.5s"/>
  <circle cx="100" cy="45" r="3" fill="#4ECDC4" class="sparkle" style="animation-delay: 1s"/>
  
  <style>
    .blocks {
      animation: organize 2s ease-in-out infinite;
    }
    .sparkle {
      animation: twinkle 1.5s ease-in-out infinite;
    }
    @keyframes organize {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-3px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }
  </style>
</svg>